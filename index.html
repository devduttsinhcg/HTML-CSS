<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            background-color: #02C1A5;
            height: 1000px;
            width: 1900px;
            position: relative;
        }

        .cont {
            height: 800px;
            width: 1500px;
            background-color: white;
            position: relative;
            top: 80px;
            margin: auto;
        }

        .mini {
            border: 3px solid transparent;
            height: 100px;
            display: flex;
        }

        .c1 {
            border: 1px solid transparent;
            height: 100px;
            width: 250px;
            font-size: 50px;
            display: flex;
            padding-left: 30px;
            align-items: center;
        }

        .c2 {
            border: 1px solid transparent;
            height: 100px;
            width: 800px;
            display: flex;
            justify-content: left;
            align-items: center;
            padding-left: 250px;
            font-size: 20px;
            word-spacing: 5px;
        }

        .c3 {
            border: 1px solid transparent;
            height: 100px;
            width: 410px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            word-spacing: 50px;
        }

        .mini2 {
            border: 2px solid transparent;
            height: 600px;
            width: 600px;
            position: relative;
        }

        .mini2 h1 {
            font-size: 100px;
            font-family: sans-serif;
            color: #3B2E49;
            position: absolute;
            left: 30px;
            top: 100px
        }

        .mini2 div p {
            font-size: 20px;
            border: 1px solid transparent;
            width: 560px;
            color: grey;
            font-family: sans-serif;
            position: relative;
            top: 400px;
            left: 30px;
        }

        .mini2 button {
            color: white;
            background-color: red;
            height: 50px;
            width: 250px;
            font-size: 25px;
            border-radius: 40px;
            position: relative;
            top: 400px;
            left: 30px;
        }

        .main2 {
            border: 4px solid transparent;
            height: 740px;
            width: 1495px;
            display: flex;
        }

        .mini3 {
            border: 1px solid transparent;
            height: 600px;
            width: 900px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .mini3 div {
            border: 1px black;
            height: 500px;
            width: 250px;
            border-radius:40px;
        }

        .mini3 div:hover {
            height: 550px;
        }
        .mini2 button:hover{
            height: 70px;
            width: 300px;
            background-color: red;
        }
        
    </style>
</head>

<body>
    <div class="main">
        <div class="cont">

                <div class="c1">travel.</div>

                <div class="c3">ABOUT CONTACT</div>
            </div>
            <div class="main2">
                <div class="mini2">
                    <h1>Must see Places</h1>
                    <div>
                        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Placeat ab illo obcaecati mollitia
                            dolore velit fugiat a voluptatum.</p>
                    </div>
                    <button>Explore</button>
                </div>

                <div class="mini3">
                    <div
                        style="background-image: url(https://media.istockphoto.com/id/1571494714/photo/view-of-golden-gate-bridge.jpg?s=1024x1024&w=is&k=20&c=CjGq7GX4096tSqcfS6JXoFUUHrujBcBr-XqDWa9PY8Q=); margin-top: 60px;">
                    </div>
                    <div
                        style="background-image: url(https://media.istockphoto.com/id/460765657/photo/the-large-blue-capital-gate-tower.jpg?s=1024x1024&w=is&k=20&c=VqWzmbZX0kPEdTym6AbWSgMZpMs6sy6ypQWpvR-l2Tg=); margin-bottom: 60px">
                    </div>

                        style="background-image: url(https://images.pexels.com/photos/28882936/pexels-photo-28882936.jpeg?_gl=1*1kl1mcc*_ga*MTUwNzkzMjcxNi4xNzg4MjQwNTYy*_ga_8JE65Q40S6*czE3OTAxNDAyMTMkbzMkZzEkdDE3OTAxNDAyMjckajQ2JGwwJGgw); margin-top: 30px;">
                    </div>
                </div>

            </div>
        </div>

</html>
